[project]
name = "authskaf"
version = "0.1.0"
description = "A simple project scaffolding tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
authskaf = "authskaf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
